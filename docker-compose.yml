services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codetrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-codetrack}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codetrack}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./Backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-codetrack};Username=${POSTGRES_USER:-codetrack};Password=${POSTGRES_PASSWORD}"
      Auth__AllowedEmailDomain: ${ALLOWED_EMAIL_DOMAIN:-}
      Jwt__Secret: ${JWT_SECRET:?set JWT_SECRET in .env}
      Jwt__Issuer: ${JWT_ISSUER:-codetrack}
      Jwt__Audience: ${JWT_AUDIENCE:-codetrack}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-60}
      Reports__ProjectName: ${REPORT_PROJECT_NAME:-}
      Reports__Period: ${REPORT_PERIOD:-}
      Reports__Responsible: ${REPORT_RESPONSIBLE:-}
      Reports__Advisor: ${REPORT_ADVISOR:-}
      Admin__ControlNumber: ${ADMIN_CONTROL_NUMBER:-}
      Admin__FullName: ${ADMIN_FULL_NAME:-}
      Admin__Email: ${ADMIN_EMAIL:-}
      Admin__Password: ${ADMIN_PASSWORD:-}
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health | grep -q '\"status\":\"Healthy\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

volumes:
  pgdata:
